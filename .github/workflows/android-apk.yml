# Membuat chillguard.apk otomatis di server GitHub (tanpa Android Studio).
# Jalan saat push yang mengubah folder android/, atau manual: tab Actions > Build APK Android > Run workflow.
name: Build APK Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/ChillGuardApp
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ganti nama menjadi chillguard.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/chillguard.apk"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: chillguard-apk
          path: chillguard.apk
          if-no-files-found: error
